<dialog id="legado-dialog" class="legado-dialog" aria-labelledby="legado-dialog-title">
  <header><span class="eyebrow">LEGADO READER</span><button id="legado-dialog-close" type="button" class="icon-button" aria-label="关闭 Legado 提示">×</button></header>
  <h2 id="legado-dialog-title">用 Legado 接着读。</h2>
  <p id="legado-dialog-message"></p>
  <p class="legado-dialog-help">Legado 需要单独安装。书包保留原文件，Legado 保存它的阅读进度和书签，两边的进度暂不互通。</p>
  <a class="primary-button" href="https://github.com/LegadoTeam/legado/releases/latest">查看 Legado 下载</a>
  <button id="legado-use-builtin" class="secondary-button" type="button">改用内置阅读</button>
</dialog>
