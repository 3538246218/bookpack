<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书包 · 网页测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15201d;color:#e6ece3;font:14px/1.7 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:24px;max-width:1150px;margin:auto;padding:20px 26px}h1{margin:0;font-size:19px;font-weight:500;letter-spacing:.08em}p{margin:5px 0;color:#afc0b4;font-size:12px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #6e8679;border-radius:8px;background:transparent;padding:8px 12px;min-height:42px}button[aria-pressed=true]{background:#d5e2d6;color:#23342a;border-color:#d5e2d6}a{text-underline-offset:4px;font-size:12px}main{display:grid;justify-items:center;padding:4px 18px 20px}.frame{width:min(390px,100%);height:min(844px,calc(100dvh - 135px));min-height:440px;border:1px solid #73877a;border-radius:22px;overflow:hidden;box-shadow:0 22px 65px #0005;background:#d4e5ed}iframe{display:block;border:0;width:100%;height:100%}.frame.wide{width:min(1100px,100%)}@media(max-width:650px){header{padding:15px 18px;display:block}nav{margin-top:12px}main{padding:0}.frame{width:100%!important;min-height:600px;height:calc(100dvh - 170px);border-radius:0;border-inline:0}}
</style></head><body>
<header><div><h1>书包 · 网页测试</h1><p>TXT / EPUB 可以实际导入阅读。Legado 原生跳转留待安卓验证。</p><a href="/#library">直接打开网页 ↗</a></div><nav aria-label="预览尺寸"><button data-width="390" aria-pressed="true">手机 390</button><button data-width="430" aria-pressed="false">大屏 430</button><button data-width="wide" aria-pressed="false">网页宽屏</button></nav></header>
<main><div class="frame" id="preview-frame"><iframe title="书包手机版网页" src="/#library"></iframe></div></main>
<script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const frame=document.getElementById('preview-frame'),wide=button.dataset.width==='wide';frame.classList.toggle('wide',wide);frame.style.width=wide?'':`min(${button.dataset.width}px,100%)`;document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script>
</body></html>
