plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.bookpack.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bookpack.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES'] } }
}
chaquopy {
    defaultConfig {
        version '3.12'
        buildPython(project.findProperty('bookpackPython') ?: 'python')
        pyc { src = false }
    }
}
