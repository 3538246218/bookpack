plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.bookpack.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bookpack.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
    packaging { resources { excludes += ['META-INF/*','tables/Transcoder_*.bin','*.proto','**/*.proto','src/**'] } }
}
dependencies {
    implementation project(':legado')
    implementation libs.appcompat.appcompat
    implementation libs.kotlin.reflect
    coreLibraryDesugaring libs.desugar
}
chaquopy {
    defaultConfig {
        version '3.12'
        buildPython(project.findProperty('bookpackPython') ?: 'python')
        pyc { src = false }
    }
}
